name: Publish All My Glams v0.2 Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-v0.2-once.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore .\AllMyGlams\AllMyGlams.csproj
          dotnet build .\AllMyGlams\AllMyGlams.csproj --configuration Release --no-restore

      - name: Locate package
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ".\AllMyGlams\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }
          Copy-Item $package.FullName "$env:RUNNER_TEMP\latest.zip" -Force
          "path=$env:RUNNER_TEMP\latest.zip" >> $env:GITHUB_OUTPUT

      - name: Create v0.2 release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.2.0.0
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG "${{ steps.package.outputs.path }}#latest.zip" --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG "${{ steps.package.outputs.path }}#latest.zip" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "All My Glams 0.2.0.0" --notes "v0.2: live complete-look Dresser, explicit None handling, Revert to Game, unified Wardrobe, automatic Glamourer/Penumbra refresh, live external equipment sync, overwrite-safe naming, and first cached Eorzea Collection individual-glamour import."
          }

      - name: Update custom repository manifest
        shell: pwsh
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          $download = "https://github.com/JustPixelll/AllMyGlams/releases/download/v0.2.0.0/latest.zip"
          $manifest = @(Get-Content ".\pluginmaster.json" -Raw | ConvertFrom-Json)
          if ($manifest.Count -ne 1) { throw "Expected exactly one plugin entry in pluginmaster.json." }

          $manifest[0].AssemblyVersion = "0.2.0.0"
          $manifest[0].DownloadLinkInstall = $download
          $manifest[0].DownloadLinkUpdate = $download
          $manifest[0].LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds().ToString()
          $manifest[0].Changelog = "v0.2: Live complete-look Dresser; explicit None slots; Revert to Game; unified Wardrobe; automatic Glamourer/Penumbra refresh; external equipment sync; safer naming/override rules; and first cached Eorzea Collection individual-glamour import."

          ConvertTo-Json -InputObject $manifest -Depth 10 | Set-Content ".\pluginmaster.json" -Encoding UTF8

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pluginmaster.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "chore: update plugin repository for v0.2.0.0"
            git push origin main
          }
