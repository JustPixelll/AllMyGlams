name: Publish All My Glams

on:
  push:
    branches: [ main ]
    paths:
      - 'AllMyGlams/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $destination = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "$env:RUNNER_TEMP\dalamud.zip"
          Expand-Archive -Force "$env:RUNNER_TEMP\dalamud.zip" $destination

      - name: Restore and build
        shell: pwsh
        run: |
          dotnet restore .\AllMyGlams\AllMyGlams.csproj
          dotnet build .\AllMyGlams\AllMyGlams.csproj --configuration Release --no-restore

      - name: Read version and package
        id: meta
        shell: pwsh
        run: |
          [xml]$project = Get-Content .\AllMyGlams\AllMyGlams.csproj
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Version missing from csproj" }
          $tag = "v$version"

          $package = Get-ChildItem -Path ".\AllMyGlams\bin" -Filter "latest.zip" -Recurse | Select-Object -First 1
          if (-not $package) { throw "DalamudPackager did not create latest.zip" }

          $releasePackage = Join-Path $env:RUNNER_TEMP "AllMyGlams.zip"
          Copy-Item $package.FullName $releasePackage -Force

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "package=$releasePackage" >> $env:GITHUB_OUTPUT

      - name: Create or update GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PACKAGE: ${{ steps.meta.outputs.package }}
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $env:PACKAGE --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG $env:PACKAGE --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "All My Glams $env:VERSION" --notes "Automated experimental AllMyGlams build."
          }

      - name: Generate Dalamud repository JSON
        shell: pwsh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          $download = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/AllMyGlams.zip"
          $entry = @{
            Author = "JustPixelll"
            Name = "All My Glams"
            InternalName = "AllMyGlams"
            AssemblyVersion = $env:VERSION
            TestingAssemblyVersion = $env:VERSION
            Description = "Build equipment-only glamour designs, capture and apply looks through Glamourer, keep a local favourites wardrobe, and manage equipment-affecting Penumbra mods from one UI."
            Punchline = "Your glamour, Glamourer and Penumbra outfit workspace."
            ApplicableVersion = "any"
            RepoUrl = "https://github.com/$env:GITHUB_REPOSITORY"
            DalamudApiLevel = 15
            TestingDalamudApiLevel = 15
            IsHide = $false
            IsTestingExclusive = $false
            DownloadCount = 0
            LastUpdate = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
            LoadPriority = 0
            DownloadLinkInstall = $download
            DownloadLinkUpdate = $download
            DownloadLinkTesting = $download
            Tags = @("glamour", "glamourer", "penumbra", "mods", "wardrobe", "utility")
          }
          @($entry) | ConvertTo-Json -Depth 6 | Set-Content "$env:RUNNER_TEMP\repo.json" -Encoding utf8

      - name: Publish repo.json branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin repo:repo 2>$null
          if ($LASTEXITCODE -eq 0) {
            git switch repo
          } else {
            git switch --orphan repo
            git rm -rf . 2>$null
          }

          Copy-Item "$env:RUNNER_TEMP\repo.json" .\repo.json -Force
          git add repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update plugin repository to ${{ steps.meta.outputs.version }}"
            git push origin repo
          }
